services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fletes
      POSTGRES_PASSWORD: fletes
      POSTGRES_DB: fletes
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fletes -d fletes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fletes:fletes@postgres:5432/fletes
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
