[project]
name = "fletes-mudanzas-express"
version = "0.1.0"
description = "Sistema de gestión para Fletes y Mudanzas Express"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# H13 (T003): `scripts` NO se empaqueta a propósito. Es código de una sola ejecución que se corre
# desde el checkout con `python -m scripts.migracion`, no parte del desplegable web: si fuera
# incluido, una imagen de producción cargaría openpyxl y el módulo de migración sin necesidad.
# `pytest` igual lo encuentra gracias a `pythonpath = ["."]` de abajo.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
