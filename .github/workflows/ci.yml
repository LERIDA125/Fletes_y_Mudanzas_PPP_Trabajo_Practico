name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests unitarios
        working-directory: backend
        run: pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fletes
          POSTGRES_PASSWORD: fletes
          POSTGRES_DB: fletes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fletes -d fletes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # El conftest de integración deriva la base `fletes_test` a partir de esta URL y la crea si
      # hace falta (tests/integration/conftest.py::_url_de_test).
      DATABASE_URL: postgresql+psycopg://fletes:fletes@localhost:5432/fletes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Aplicar migraciones
        working-directory: backend
        run: alembic upgrade head
      - name: Tests de integración
        working-directory: backend
        run: pytest tests/integration
